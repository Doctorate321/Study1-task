<script>
// =====================================================================
// SETTINGS YOU MUST EDIT (copy both values from your Google Apps Script setup)
// =====================================================================
const SAVE_URL = 'https://script.google.com/macros/s/AKfycbypVmcQ6zoZL_msQAXij-ZZJg_Pl63yASrSJEVa8sY8pD_j7aKPTNc-VXdFlP6Bm83moQ/exec'; 
const SECRET   = 'blue-kettle-186';   
const IS_TEST  = new URLSearchParams(window.location.search).has('test');

// Do not change this list after real data collection starts
const COLUMNS = ['participant_id','test','condition','withdrawn','trial_index','screen','facet','scale','item_id',
  'round','question','response','rating','rung_score','inconsistent','correct','attention_pass','delegate','W',
  'chosen_by','agent_pick','mc_correct','answer','rt','time_elapsed','ladder_order','scale_block_order',
  'avg_welfare','delegation_count','consequence_round','consequence_W','items_json'];

// =====================================================================
// SAVING THE DATA
// =====================================================================
function buildRows() {
  const all = jsPsych.data.get().values();
  const w = (all[all.length - 1].withdrawn === true);
  return all.map(function (t) {
    const row = {};
    COLUMNS.forEach(function (c) {
      let v = t[c];
      if (c === 'test') { v = IS_TEST; }
      if (c === 'withdrawn') { v = w; }
      if (c === 'response' && v !== null && typeof v === 'object') { v = JSON.stringify(v); }
      row[c] = (v === undefined || v === null) ? '' : v;
    });
    return row;
  });
}

let LAST_ERROR = '';
async function sendData(payload) {
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const resp = await fetch(SAVE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const text = await resp.text();
      let out = null;
      try { out = JSON.parse(text); } catch (e2) { LAST_ERROR = 'The reply was not data: ' + text.slice(0, 150); }
      if (out && out.ok) { return true; }
      if (out && !out.ok) { LAST_ERROR = 'The script said: ' + out.error; }
    } catch (e) { LAST_ERROR = 'Network problem: ' + e; }
    await new Promise(function (r) { setTimeout(r, 1500 * attempt); });
  }
  if (IS_TEST) { alert('TEST INFO: ' + LAST_ERROR); }
  return false;
}

async function finishUp() {
  const all = jsPsych.data.get().values();
  const last = all[all.length - 1];
  const pid = all[0].participant_id;
  const box = function (html) {
    document.body.innerHTML = '<div style="max-width:600px;margin:60px auto;padding:0 16px;font-family:Arial,sans-serif;line-height:1.5">' + html + '</div>';
  };
  if (last.screen !== 'end') {   // did not finish, for example did not consent
    box('<p>Thank you. You may close this page.</p>');
    return;
  }
  box('<p>Saving your answers. Please wait and do not close this page...</p>');
  const withdrew = (last.withdrawn === true);
  const rows = withdrew ? [{ participant_id: pid, test: IS_TEST, withdrawn: true }] : buildRows();
  const ok = await sendData({ secret: SECRET, participant_id: pid, columns: COLUMNS, rows: rows });
  if (ok) {
    box('<p>Thank you. Your answers were saved. You may close this page.</p>');
  } else {
    box('<p>Sorry, we could not save your answers automatically.</p>' +
        '<p>Please click the button below to download a file, and email it to [sibtain186@gmail.com].</p>' +
        '<p><button id="dl">Download my answers</button></p>');
    document.getElementById('dl').onclick = function () {
      const blob = new Blob([JSON.stringify(rows)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'study1_' + pid + '.json';
      a.click();
    };
  }
}

// =====================================================================
// START THE EXPERIMENT AND ASSIGN THE CONDITION AT RANDOM
// =====================================================================
const jsPsych = initJsPsych({
  on_finish: function () { finishUp(); }
});

const condition = jsPsych.randomization.sampleWithoutReplacement(['aligned', 'misaligned'], 1)[0];
jsPsych.data.addProperties({
  condition: condition,
  participant_id: jsPsych.randomization.randomID(8)
});

// =====================================================================
// SCREENS 1 TO 3: CONSENT, ASSISTANT CARD, UNDERSTANDING CHECK
// =====================================================================
const cardAligned =
  '<div class="card"><h3>Your shopping assistant: ShopMate</h3><ul>' +
  '<li>Carries out its selections correctly about 90% of the time.</li>' +
  '<li>Earns <b>no commission</b> from any product it picks.</li>' +
  '</ul></div>';

const cardMisaligned =
  '<div class="card"><h3>Your shopping assistant: ShopMate</h3><ul>' +
  '<li>Carries out its selections correctly about 90% of the time.</li>' +
  '<li>Earns a <b>commission from sellers</b> and tends to favor products that pay it more.</li>' +
  '</ul></div>';

const cardToShow = (condition === 'aligned') ? cardAligned : cardMisaligned;

// ---- Screen 1: welcome and consent ----
const consent = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `<div style="text-align:left;max-width:680px;margin:auto">
  <h2>Participant Information &amp; Informed Consent</h2>

  <p><strong>Study title:</strong> Decision-Making with Automated Shopping Assistants</p>
  <p><strong>Principal investigator:</strong> [Dr. Syed Sibtain Ali Shah Kazmi, Department of Management Sciences, Abbottabad University of Science & Technology, Pakistan]</p>

  <p><strong>Purpose and procedure:</strong> You are invited to take part in a single-session academic study on how people decide how much an automated shopping assistant may do for them. You will read a brief description of a digital shopping assistant, answer a set of questions, and complete a simulated product-selection task using made-up products. The session takes approximately [20 to 25] minutes. Some details about the study are withheld until the end, because explaining them now could change your responses. You will receive a full explanation on the final screen.</p>

  <p><strong>Voluntary participation and academic credit:</strong> Your participation is completely voluntary. You may stop at any time by closing your browser, without penalty. Nothing is saved unless you reach the end of the task. If you are participating for course credit, credit is granted independently of your task decisions or performance, and non-participation carries no academic penalty.</p>

  <p><strong>Risks, benefits and stakes:</strong> This study involves minimal risk. The shopping tasks are simulated and involve no real purchases or personal financial loss. You will see a score for your choices; it is part of a made-up task and says nothing about your ability. </p>

  <p><strong>Confidentiality and data protection:</strong> We do not ask for your name, email address, or phone number. Your responses are recorded under a random participant code and stored in a password-protected online spreadsheet (Google Sheets) that only the research team can open. The servers may be located outside Pakistan, and the companies hosting this page and the spreadsheet may keep technical logs under their own policies; the research team does not receive them. No personally identifying information will appear in any publication or shared dataset.</p>

  <p><strong>Debriefing, withdrawal and contact:</strong> Full details about the study will be given on the final screen, where you can also choose to have your data deleted. Afterwards, you may email us with your participant code until [December 20, 2026] to have your data removed. For questions about this research, contact [sibtain186@gmail.com]. </p>

  <p><em>By clicking “I am 18 or older and I agree to take part” below, you confirm that you are 18 years of age or older, have read and understood this information, and voluntarily consent to participate.</em></p>
  </div>`,
  choices: ['I am 18 or older and I agree to take part', 'I do not agree'],
  data: { screen: 'consent' },
  on_finish: function (data) {
    if (data.response === 1) {
      jsPsych.endExperiment('Thank you. You chose not to take part. You may close this page.');
    }
  }
};

// ---- Screen 2: the assistant's profile card ----
const profileCard = {
  type: jsPsychHtmlButtonResponse,
  stimulus: '<p>Please read about the shopping assistant you may use.</p>' + cardToShow,
  choices: ['Continue'],
  enable_button_after: 5000,
  data: { screen: 'profile_card' }
};

// ---- Screen 3: understanding check ----
const check = {
  type: jsPsychHtmlButtonResponse,
  stimulus: '<p>Think about the assistant you just read about.</p>' +
            '<p><b>Does this assistant earn a commission from the products it picks?</b></p>',
  choices: ['Yes', 'No'],
  data: { screen: 'comprehension_check' },
  on_finish: function (data) {
    data.correct = (condition === 'misaligned') ? (data.response === 0) : (data.response === 1);
  }
};

// =====================================================================
// PART 3: THE THREE DELEGATION LADDERS
// =====================================================================
const ladderIntro = {
  type: jsPsychHtmlButtonResponse,
  stimulus: '<h3>How much freedom would you give ShopMate?</h3>' +
    '<p>Next you will see three short questions. For each one, choose the <b>highest</b> level of freedom you would be comfortable giving the assistant.</p>' +
    '<p>There are no right or wrong answers.</p>',
  choices: ['Continue'],
  data: { screen: 'ladder_intro' }
};

const ladderFacets = [
  {
    key: 'discretion',
    title: 'Choice freedom',
    question: 'How much freedom should the assistant have when choosing products for you?',
    rungs: [
      'It may only recommend products. I make every choice myself.',
      'It may pick from a shortlist that I make.',
      'It may pick any product that fits my stated needs.',
      'It may also swap in similar products if my first choice is unavailable.',
      'It may choose whatever it judges best, with full freedom.'
    ]
  },
  {
    key: 'spending',
    title: 'Spending limit',
    question: 'In this shop, a typical pair of headphones costs about Rs 6,000. How much may the assistant spend on one purchase?',
    rungs: [
      'Up to Rs 1,500 on one purchase.',
      'Up to Rs 3,000 on one purchase.',
      'Up to Rs 4,500 on one purchase.',
      'Up to Rs 6,000 on one purchase.',
      'Up to Rs 7,500 on one purchase.'
    ]
  },
  {
    key: 'review',
    title: 'Checking purchases',
    question: 'When should you get to check what the assistant buys?',
    rungs: [
      'I approve every purchase before it happens.',
      'I approve only purchases above a set price.',
      'The assistant buys, and I am told right after each purchase.',
      'The assistant buys, and I get one summary at the end.',
      'The assistant buys, and I do not check anything.'
    ]
  }
];

// Builds one ladder question plus an optional "just checking" question
function makeLadder(f) {
  const n = f.rungs.length;
  let score = 0;   // remembers this ladder's answer (0 = none, 1 to 5 = level)

  const ladder = {
    type: jsPsychHtmlButtonResponse,
    stimulus: '<h3>' + f.title + '</h3><p>' + f.question + '</p>' +
              '<p><i>Choose the highest level you would accept.</i></p>',
    choices: f.rungs.concat(['None of these. I would not accept any of them.']),
    button_layout: 'grid',
    grid_columns: 1,
    data: { screen: 'ladder', facet: f.key },
    on_finish: function (data) {
      score = (data.response < n) ? data.response + 1 : 0;
      data.rung_score = score;
    }
  };

  const followUp = {
    timeline: [{
      type: jsPsychHtmlButtonResponse,
      stimulus: function () {
        return '<p>Just checking. Would you <b>also</b> accept this next level?</p>' +
               '<p><b>' + f.rungs[score] + '</b></p>';
      },
      choices: ['Yes', 'No'],
      data: { screen: 'ladder_check', facet: f.key },
      on_finish: function (data) {
        data.inconsistent = (data.response === 0);
      }
    }],
    conditional_function: function () {
      return score >= 1 && score < n;
    }
  };
  return [ladder, followUp];
}

// Show the three ladders in a random order and record that order
const shuffledFacets = jsPsych.randomization.shuffle(ladderFacets);
jsPsych.data.addProperties({ ladder_order: shuffledFacets.map(f => f.key).join(' > ') });
const ladderTrials = shuffledFacets.map(makeLadder).flat();

// =====================================================================
// PART 4: SURVEY SCALES (adapted from published sources) AND ATTENTION CHECK
// =====================================================================
const AGREE  = ['Strongly disagree', '2', '3', '4', '5', '6', 'Strongly agree'];
const EXTENT = ['Not at all', '2', '3', '4', '5', '6', 'Extremely'];

const scaleIntro = {
  type: jsPsychHtmlButtonResponse,
  stimulus: '<h3>A few statements about ShopMate</h3>' +
    '<p>For each statement, choose the number that fits best. The labels under each statement show what 1 and 7 mean.</p>',
  choices: ['Continue'],
  data: { screen: 'scale_intro' }
};

const scaleItems = [
  // Trust: S-TIAS (McGrath et al., 2025; from Jian et al., 2000, items 6, 10, 11)
  { scale: 'trust', id: 'tru1', anchors: EXTENT, text: 'I am confident in ShopMate.' },
  { scale: 'trust', id: 'tru2', anchors: EXTENT, text: 'ShopMate is reliable.' },
  { scale: 'trust', id: 'tru3', anchors: EXTENT, text: 'I can trust ShopMate.' },

  // Intention: adapted from the BI items in McGrath et al. (2025)
  { scale: 'intention', id: 'int1', anchors: AGREE, text: 'I expect that I would let ShopMate choose and buy products for me.' },
  { scale: 'intention', id: 'int2', anchors: AGREE, text: 'I would let ShopMate choose and buy products for me.' },
  { scale: 'intention', id: 'int3', anchors: AGREE, text: 'I would like to let ShopMate choose and buy products for me when I shop.' },

  // Perceived control: adapted from the Perceived Content Control items in Wang, Li & Zhang (2026)
  { scale: 'control', id: 'con1', anchors: AGREE, text: 'If I used ShopMate, I could guide the direction of what it buys for me.' },
  { scale: 'control', id: 'con2', anchors: AGREE, text: 'If I used ShopMate, I could adjust what it buys to better match my intentions.' },
  { scale: 'control', id: 'con3', anchors: AGREE, text: 'If I used ShopMate, I could change what it buys by refining or redirecting my instructions.' }
];

const attentionItem = {
  scale: 'attention', id: 'att1', anchors: AGREE,
  text: 'To show you are reading carefully, please choose 7 for this statement.'
};

// Keep each scale together; randomize scale order and item order; attention check after the first scale
const blockOrder = jsPsych.randomization.shuffle(['trust', 'intention', 'control']);
let ordered = [];
blockOrder.forEach(function (b) {
  ordered = ordered.concat(jsPsych.randomization.shuffle(scaleItems.filter(i => i.scale === b)));
});
const firstBlockSize = scaleItems.filter(i => i.scale === blockOrder[0]).length;
ordered.splice(firstBlockSize, 0, attentionItem);
jsPsych.data.addProperties({ scale_block_order: blockOrder.join(' > ') });

const scaleTrials = ordered.map(function (item) {
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: '<p>Think about ShopMate, the assistant you read about.</p>' +
              '<p><b>' + item.text + '</b></p>' +
              '<p><small>1 = ' + item.anchors[0] + ' &nbsp;&nbsp;&nbsp; 7 = ' + item.anchors[6] + '</small></p>',
    choices: ['1', '2', '3', '4', '5', '6', '7'],
    data: { screen: 'scale_item', scale: item.scale, item_id: item.id },
    on_finish: function (data) {
      data.rating = data.response + 1;
      if (item.scale === 'attention') { data.attention_pass = (data.rating === 7); }
    }
  };
});

// =====================================================================
// PART 5: TEN PURCHASE ROUNDS (let ShopMate pick, or choose yourself)
// =====================================================================
// STARTING VALUES. They will be replaced after the calibration pretest.
const P_AGENT     = 0.90;   // chance the agent carries out its own target pick
const K_TOP       = 3;      // misaligned agent: highest-commission item among the top K by value
const N_ITEMS     = 8;      // products per round
const N_ROUNDS    = 10;
const VIEW_MS     = 10000;  // milliseconds locked before choosing yourself
const PRICE_SCALE = 50;     // turns the base price units into rupees (check against local prices)

const brands = ['Aurel','Brixa','Calden','Dovan','Elmar','Fenix','Garo','Helio','Ivor','Jarel','Kovin','Lumo','Marek','Norin','Orvia','Pelto','Quill','Ravon','Sorel','Tavin','Ulmar','Vexa','Wendo','Xaro'];

function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

function makeRound(r) {
  const names = jsPsych.randomization.sampleWithoutReplacement(brands, N_ITEMS);
  const items = names.map(function (n) {
    const sound = randInt(4, 9), battery = randInt(4, 9);
    let price = Math.round((30 + 7 * (sound + battery) + randInt(-25, 25)) / 5) * 5;
    if (price < 30) { price = 30; }
    price = price * PRICE_SCALE;
    const value = ((sound + battery) / 2) / price * 100;
    return { name: n + ' Headphones', sound: sound, battery: battery, price: price,
             value: value, commission: 0.12 * price };
  });
  const vals = items.map(function (i) { return i.value; });
  const best = Math.max.apply(null, vals), worst = Math.min.apply(null, vals);
  items.forEach(function (i) { i.W = (best === worst) ? 1 : (i.value - worst) / (best - worst); });

  // The agent's target item
  const order = items.map(function (_, idx) { return idx; })
                     .sort(function (a, b) { return items[b].value - items[a].value; });
  let target = order[0];
  if (condition === 'misaligned') {
    const top = order.slice(0, K_TOP);
    target = top.reduce(function (bi, idx) {
      return items[idx].commission > items[bi].commission ? idx : bi;
    }, top[0]);
  }
  // The agent carries out its target with probability P_AGENT, otherwise picks another item at random
  let agentPick = target;
  if (Math.random() > P_AGENT) {
    const others = items.map(function (_, idx) { return idx; })
                        .filter(function (idx) { return idx !== target; });
    agentPick = others[Math.floor(Math.random() * others.length)];
  }
  return { round: r, items: items, agentPick: agentPick, delegated: null };
}

const rounds = [];
for (let r = 1; r <= N_ROUNDS; r++) { rounds.push(makeRound(r)); }
const roundResults = [];

const roundsIntro = {
  type: jsPsychHtmlButtonResponse,
  stimulus: '<h3>Ten shopping rounds</h3>' +
    '<p>In each round, you want the <b>best-value headphones</b>: high sound and battery scores for a low price.</p>' +
    '<p>For each round you decide: let ShopMate pick for you, or choose yourself. Choosing yourself means you look at all ' +
    N_ITEMS + ' products, and you can choose only after ' + (VIEW_MS / 1000) + ' seconds.</p>' +
    '<p>At the end you will see how well the headphones chosen for you scored.</p>',
  choices: ['Start'],
  data: { screen: 'rounds_intro' }
};

const roundTrials = [];
rounds.forEach(function (rd) {
  const decide = {
    type: jsPsychHtmlButtonResponse,
    stimulus: '<h3>Round ' + rd.round + ' of ' + N_ROUNDS + '</h3><p>Who should pick the headphones this round?</p>',
    choices: ['Let ShopMate pick', 'I will choose myself'],
    data: { screen: 'round_decision', round: rd.round,
            items_json: JSON.stringify(rd.items), agent_pick: rd.agentPick },
    on_finish: function (data) {
      rd.delegated = (data.response === 0);
      data.delegate = rd.delegated;
      if (rd.delegated) {
        const W = rd.items[rd.agentPick].W;
        data.W = W;
        data.chosen_by = 'agent';
        roundResults.push({ round: rd.round, delegate: true, W: W });
      }
    }
  };
  const choose = {
    timeline: [{
      type: jsPsychHtmlButtonResponse,
      stimulus: '<h3>Round ' + rd.round + ' of ' + N_ROUNDS + '</h3>' +
                '<p>Choose the best-value headphones. The buttons unlock after ' + (VIEW_MS / 1000) + ' seconds.</p>',
      choices: rd.items.map(function (i) {
        return '<b>' + i.name + '</b><br>Sound: ' + i.sound + '/10<br>Battery: ' + i.battery + '/10<br>Price: Rs ' + i.price.toLocaleString('en-US');
      }),
      enable_button_after: VIEW_MS,
      button_layout: 'grid',
      grid_columns: 2,
      data: { screen: 'round_self_choice', round: rd.round },
      on_finish: function (data) {
        const W = rd.items[data.response].W;
        data.W = W;
        data.chosen_by = 'self';
        roundResults.push({ round: rd.round, delegate: false, W: W });
      }
    }],
    conditional_function: function () { return rd.delegated === false; }
  };
  roundTrials.push(decide, choose);
});

// Feedback: average score, delegation count, and one randomly drawn round
const feedback = {
  type: jsPsychHtmlButtonResponse,
  stimulus: function () {
    const avg = roundResults.reduce(function (s, x) { return s + x.W; }, 0) / roundResults.length;
    const nDel = roundResults.filter(function (x) { return x.delegate; }).length;
    const pick = roundResults[Math.floor(Math.random() * roundResults.length)];
    jsPsych.data.addProperties({
      avg_welfare: Math.round(avg * 1000) / 1000,
      delegation_count: nDel,
      consequence_round: pick.round,
      consequence_W: Math.round(pick.W * 1000) / 1000
    });
    return '<h3>Your results</h3>' +
      '<p>You let ShopMate pick in <b>' + nDel + '</b> of ' + N_ROUNDS + ' rounds.</p>' +
      '<p>Average score of the headphones chosen for you: <b>' + Math.round(avg * 100) + '</b> out of 100.</p>' +
      '<p>In randomly selected round ' + pick.round + ', the headphones chosen for you scored <b>' +
      Math.round(pick.W * 100) + '</b> out of 100.</p>';
  },
  choices: ['Continue'],
  data: { screen: 'feedback' }
};

// =====================================================================
// PART 6: FINAL CHECKS, BACKGROUND QUESTIONS, DEBRIEF
// =====================================================================
const manipCheck = {
  type: jsPsychHtmlButtonResponse,
  stimulus: '<p>Thinking back to the description of ShopMate:</p>' +
            '<p><b>Which statement matched ShopMate?</b></p>',
  choices: [
    'It earns no commission from the products it picks.',
    'It earns a commission from sellers and tends to favor products that pay it more.',
    'I do not remember.'
  ],
  button_layout: 'grid',
  grid_columns: 1,
  data: { screen: 'manipulation_check' },
  on_finish: function (data) {
    const correctIdx = (condition === 'aligned') ? 0 : 1;
    data.mc_correct = (data.response === correctIdx);
  }
};

const perceivedAlign = {
  type: jsPsychHtmlButtonResponse,
  stimulus: '<p><b>Overall, whose interests did ShopMate mainly serve when it picked products?</b></p>' +
            '<p><small>1 = The sellers &nbsp;&nbsp;&nbsp; 7 = Me</small></p>',
  choices: ['1', '2', '3', '4', '5', '6', '7'],
  data: { screen: 'perceived_alignment' },
  on_finish: function (data) { data.rating = data.response + 1; }
};

const suspicion = {
  type: jsPsychSurveyText,
  questions: [
    { prompt: 'What do you think this study was about?', rows: 3, required: false, name: 'study_guess' },
    { prompt: 'Did anything in the study seem unusual or hard to believe? If so, please describe it.', rows: 3, required: false, name: 'unusual' }
  ],
  data: { screen: 'suspicion_probe' }
};

function makeChoice(id, prompt, choices) {
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: '<p>' + prompt + '</p>',
    choices: choices,
    button_layout: 'grid',
    grid_columns: 1,
    data: { screen: 'background', question: id },
    on_finish: function (d) { d.answer = choices[d.response]; }
  };
}

const bgTrials = [
  makeChoice('age_group', 'What is your age group?',
    ['18 to 24', '25 to 34', '35 to 44', '45 to 54', '55 or older', 'Prefer not to say']),
  makeChoice('gender', 'Which best describes you?',
    ['Woman', 'Man', 'Non-binary or another description', 'Prefer not to say']),
  makeChoice('shop_freq', 'How often do you shop online?',
    ['Rarely or never', 'A few times a year', 'About once a month', 'About once a week', 'Several times a week']),
  makeChoice('tech_familiar', 'How familiar are you with AI tools such as chatbots or AI assistants?',
    ['Not at all familiar', 'Slightly familiar', 'Moderately familiar', 'Very familiar', 'Extremely familiar']),
  makeChoice('ai_shop_use', 'Have you ever used an AI assistant to help you shop?',
    ['Yes', 'No', 'Not sure'])
];

const debrief = {
  type: jsPsychHtmlButtonResponse,
  stimulus: function () {
    const pid = jsPsych.data.get().last(1).values()[0].participant_id;
    return '<div style="text-align:left;max-width:680px;margin:auto">' +
      '<h3>About this study</h3>' +
      '<p>Thank you for taking part. ShopMate was a <b>simulated</b> shopping assistant, and the products were made up. No real purchases were made, and ShopMate did not earn any commission.</p>' +
      '<p>Half of the participants read that ShopMate earns commissions from sellers, and half read that it does not. Which description you saw was decided at random. We did this to study how much freedom people give an assistant, and whether it depends on whose interests they believe it serves. We did not tell you this at the start because it could have changed your answers.</p>' +
      '<p>The score you saw was based on a made-up task. It is not a measure of your ability or judgment.</p>' +
      '<p>Your participant code is <b>' + pid + '</b>. Keep it if you want to ask for your data to be removed later.</p>' +
      '<p><b>Now that you know what the study was about, may we keep your answers?</b></p>' +
      '</div>';
  },
  choices: ['Yes, keep my data in the study', 'No, please delete my data'],
  data: { screen: 'debrief' },
  on_finish: function (data) {
    jsPsych.data.addProperties({ withdrawn: (data.response === 1) });
  }
};

const endScreen = {
  type: jsPsychHtmlButtonResponse,
  stimulus: '<p>That is the end of the study. Click Finish to save your answers, and keep this page open until you see a message that your answers were saved.</p>',
  choices: ['Finish'],
  data: { screen: 'end' }
};

// =====================================================================
// PART 8: PERCEIVED SAFEGUARDS AND RECOURSE (before the agent description)
//         AND PERCEIVED BETRAYAL (after the rounds)
// =====================================================================
function makeRatingTrials(items, lead) {
  return jsPsych.randomization.shuffle(items).map(function (item) {
    return {
      type: jsPsychHtmlButtonResponse,
      stimulus: '<p>' + lead + '</p><p><b>' + item.text + '</b></p>' +
                '<p><small>1 = Strongly disagree &nbsp;&nbsp;&nbsp; 7 = Strongly agree</small></p>',
      choices: ['1', '2', '3', '4', '5', '6', '7'],
      data: { screen: 'scale_item', scale: item.scale, item_id: item.id },
      on_finish: function (d) { d.rating = d.response + 1; }
    };
  });
}

// Safeguards: adapted from the structural assurance items in McKnight, Choudhury & Kacmar (2002)
// Recourse: two new items written for this study (not validated)
const recourseItems = [
  { scale: 'safeguards',   id: 'sag1', text: 'Online shopping in Pakistan has enough safeguards for me to feel comfortable buying things online.' },
  { scale: 'safeguards',   id: 'sag2', text: 'I feel assured that laws and institutions in Pakistan adequately protect me from problems when I shop online.' },
  { scale: 'safeguards',   id: 'sag3', text: 'In general, online shopping in Pakistan is now a safe environment for buying things.' },
  { scale: 'recourse_new', id: 'rcn1', text: 'If a purchase I made online went wrong, I am confident I could get a refund or replacement.' },
  { scale: 'recourse_new', id: 'rcn2', text: 'If I had a dispute with an online seller, I believe I could get it resolved fairly.' }
];

const recourseIntro = {
  type: jsPsychHtmlButtonResponse,
  stimulus: '<h3>First, a few questions about shopping online</h3>' +
    '<p>For each statement, choose the number that fits best. 1 = Strongly disagree, 7 = Strongly agree.</p>',
  choices: ['Continue'],
  data: { screen: 'recourse_intro' }
};
const recourseTrials = makeRatingTrials(recourseItems, 'Think about shopping online in Pakistan in general.');

const payTrial = makeChoice('online_payment', 'When you shop online, how do you usually pay?',
  ['Cash on delivery', 'Debit or credit card', 'Mobile wallet or bank transfer', 'I rarely shop online']);

// Betrayal: adapted from the perceived betrayal items in Gregoire & Fisher (2008), rewritten for a hypothetical agent
const betrayalItems = [
  { scale: 'betrayal', id: 'bet1', text: 'If I let ShopMate choose for me, I would feel cheated.' },
  { scale: 'betrayal', id: 'bet2', text: 'If I let ShopMate choose for me, I would feel betrayed.' },
  { scale: 'betrayal', id: 'bet3', text: 'ShopMate would not be honest with me about which products are best for me.' },
  { scale: 'betrayal', id: 'bet4', text: 'ShopMate intends to take advantage of me.' },
  { scale: 'betrayal', id: 'bet5', text: 'ShopMate would try to exploit me.' }
];
const betrayalTrials = makeRatingTrials(betrayalItems, 'Think about ShopMate, the assistant you read about.');

// =====================================================================
// RUN EVERYTHING IN ORDER
// =====================================================================
jsPsych.run(
  [consent, recourseIntro]
    .concat(recourseTrials)
    .concat([payTrial, profileCard, check, ladderIntro])
    .concat(ladderTrials)
    .concat([scaleIntro])
    .concat(scaleTrials)
    .concat([roundsIntro])
    .concat(roundTrials)
    .concat([feedback])
    .concat(betrayalTrials)
    .concat([manipCheck, perceivedAlign, suspicion])
    .concat(bgTrials)
    .concat([debrief, endScreen])
);
</script>
</html>
