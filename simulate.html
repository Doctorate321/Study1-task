<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent calibration simulation</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; line-height: 1.5; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #1c1c1c; }
  table { border-collapse: collapse; margin: 12px 0; }
  th, td { border: 1px solid #999; padding: 6px 10px; text-align: right; }
  th { background: #eee; }
  button { font-size: 16px; padding: 8px 16px; }
</style>
</head>
<body>
<h2>Agent calibration simulation</h2>
<p>This page plays the shopping task many times on the computer, using the same product and agent rules as the study, and reports the average score (W, from 0 to 1) each agent would get. It uses no participants and sends nothing anywhere.</p>
<p>Rounds to simulate: <input id="n" type="number" value="200000" min="10000" step="10000"> <button id="go">Run simulation</button></p>
<div id="out"></div>

<script>
const PRICE_SCALE = 50, N_ITEMS = 8;   // keep the same as the study task
function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

function makeItems() {
  const items = [];
  for (let i = 0; i < N_ITEMS; i++) {
    const sound = randInt(4, 9), battery = randInt(4, 9);
    let price = Math.round((30 + 7 * (sound + battery) + randInt(-25, 25)) / 5) * 5;
    if (price < 30) { price = 30; }
    price *= PRICE_SCALE;
    items.push({ value: ((sound + battery) / 2) / price * 100, commission: 0.12 * price });
  }
  const vals = items.map(i => i.value), best = Math.max(...vals), worst = Math.min(...vals);
  items.forEach(i => { i.W = (best === worst) ? 1 : (i.value - worst) / (best - worst); });
  return items;
}

function simulate(N, Ks) {
  const out = { random: 0, aligned: { target: 0, other: 0 }, mis: {} };
  Ks.forEach(k => { out.mis[k] = { target: 0, other: 0 }; });
  for (let n = 0; n < N; n++) {
    const items = makeItems();
    const idx = items.map((_, i) => i);
    const order = idx.slice().sort((a, b) => items[b].value - items[a].value);
    out.random += items[Math.floor(Math.random() * items.length)].W;
    const acc = function (tgt, rec) {
      rec.target += items[tgt].W;
      const others = idx.filter(i => i !== tgt);
      rec.other += others.reduce((s, i) => s + items[i].W, 0) / others.length;
    };
    acc(order[0], out.aligned);
    Ks.forEach(k => {
      const top = order.slice(0, k);
      const t = top.reduce((bi, i) => items[i].commission > items[bi].commission ? i : bi, top[0]);
      acc(t, out.mis[k]);
    });
  }
  out.random /= N; out.aligned.target /= N; out.aligned.other /= N;
  Ks.forEach(k => { out.mis[k].target /= N; out.mis[k].other /= N; });
  return out;
}

function f3(x) { return x.toFixed(3); }

document.getElementById('go').onclick = function () {
  const N = Math.max(10000, parseInt(document.getElementById('n').value, 10) || 200000);
  const Ks = [2, 3, 4];
  const P_HI = 0.90;                       // the "high competence" accuracy
  const r = simulate(N, Ks);
  const Wal = p => p * r.aligned.target + (1 - p) * r.aligned.other;
  const Wmis = (k, p) => p * r.mis[k].target + (1 - p) * r.mis[k].other;

  let html = '<h3>Reference points</h3><p>A person choosing at random would score about <b>' + f3(r.random) +
             '</b>. An aligned agent with ' + Math.round(P_HI * 100) + '% accuracy scores about <b>' + f3(Wal(P_HI)) + '</b>.</p>';

  html += '<h3>Aligned agent: average score by accuracy</h3><table><tr><th>Accuracy</th><th>Average score W</th></tr>';
  [1, 0.9, 0.8, 0.75, 0.7, 0.6, 0.5].forEach(p => {
    html += '<tr><td>' + Math.round(p * 100) + '%</td><td>' + f3(Wal(p)) + '</td></tr>';
  });
  html += '</table>';

  html += '<h3>Misaligned agent at ' + Math.round(P_HI * 100) + '% accuracy: score by how strongly it follows commission</h3>' +
          '<p>K is the number of top-value products it chooses among, taking the one that pays most commission. A larger K means stronger bias.</p>' +
          '<table><tr><th>K</th><th>Average score W</th><th>Loss versus aligned agent</th></tr>';
  Ks.forEach(k => {
    html += '<tr><td>' + k + '</td><td>' + f3(Wmis(k, P_HI)) + '</td><td>' + f3(Wal(P_HI) - Wmis(k, P_HI)) + '</td></tr>';
  });
  html += '</table>';

  html += '<h3>Matched pairs (use these in Study 2)</h3>' +
          '<p>For each bias level K, this is the accuracy of an <b>aligned</b> agent that loses the same average score as the misaligned agent. Use that accuracy as the "moderate competence" setting.</p>' +
          '<table><tr><th>K</th><th>Loss from misalignment</th><th>Matching moderate accuracy</th></tr>';
  Ks.forEach(k => {
    const loss = Wal(P_HI) - Wmis(k, P_HI);
    const p = (Wal(P_HI) - loss - r.aligned.other) / (r.aligned.target - r.aligned.other);
    html += '<tr><td>' + k + '</td><td>' + f3(loss) + '</td><td>' + (p * 100).toFixed(1) + '%</td></tr>';
  });
  html += '</table><p>Rule from the proposal: the two losses must differ by no more than 0.02. Round the accuracy to a whole percent and check that the rule holds.</p>';

  document.getElementById('out').innerHTML = html;
};
</script>
</body>
</html>
